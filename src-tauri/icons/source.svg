<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Modulith Desktop">
  <title>Modulith Desktop</title>

  <!--
    应用图标专用的「带底板」版本（黑底白方块）。

    为什么需要单独一份：public/modulith.svg 是裸标记（三枚方块，无底色），
    适合嵌在界面里；但「应用程序图标必须自带背景」—— 任务栏、桌面、
    开始菜单都会把无底色的图标直接贴在各种壁纸上，白色方块遇到浅色壁纸
    会完全看不见。

    因此这个文件 = 黑色底板 + 同一组方块，只用于 tauri icon 生成
    icons/ 下的那套平台图标。界面里不要引用它。

    为什么底板带一圈描边（这不是装饰）：

    近黑底板在深色环境里会与背景融为一体，已实测对比度：

      #18181b 底板 vs 启动界面背景 #101322       = 1.04:1（几乎看不见）
      #18181b 底板 vs Windows 深色任务栏 #202020 = 1.09:1（同上）
      #18181b 底板 vs 浅色壁纸 #f0f0f0           = 15.55:1（很清楚）

    不加处理时，图标在深色任务栏上会变成「三个悬空的白方块」，底板的
    形状信息完全丢失。描边取白色低透明度（0.22），在浅色背景上几乎
    不可见、在深色背景上给出清晰轮廓，两头都不突兀。

    描边向内收 0.6 单位（rect 从 0.6 起、宽 30.8），避免被 viewBox 裁掉一半。

    几何与裸标记完全一致（见 public/modulith.svg）：
      格 10x10、圆角 2.6、内边距 4、间距 4；右上格留空。
  -->

  <!-- 底板：近黑 + 低透明度白描边 -->
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="6.9"
        fill="#18181b" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" />

  <!-- 三枚方块：右上留空 -->
  <g fill="#ffffff">
    <rect x="4" y="4" width="10" height="10" rx="2.6" />
    <rect x="4" y="18" width="10" height="10" rx="2.6" />
    <rect x="18" y="18" width="10" height="10" rx="2.6" />
  </g>
</svg>
