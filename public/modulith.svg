<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Modulith Desktop">
  <title>Modulith Desktop</title>

  <!--
    Modulith Desktop 的应用标识 —— 三个方块，没有背景。

    品牌名 = module + monolith，产品主张是「需要什么功能，就加什么模块」。
    标识只保留最必要的元素：

      · 三枚方块 —— 已装入的三个 module；
      · 右下角的空位 —— 还没装的那个插槽。

    为什么去掉背景底色（这是第二次修正）：
      第一版是「渐变圆角方块 + 白色内嵌块」，在应用图标（任务栏、桌面）
      那种必须自带背景的场合是需要的；但同一个图形被复用到界面里
      （侧边栏、启动界面、关于页）时，那块渐变底色就显得笨重 ——
      它在一个已经有背景的界面上又叠了一层背景，像一个贴上去的按钮。

      现在本体就是三枚方块，不依赖任何底色：
        · 放在应用图标里 —— 由外层的圆角方块提供背景（见 icons/ 与
          AppLogo 的 `withSurface` 选项）；
        · 放在界面里 —— 直接以 currentColor 绘制，跟随所在位置的主题色。

    颜色规则（`currentColor`，由调用方决定）：
      · 深色背景 → 方块为白色（由深色主题的 text-white 提供）
      · 浅色背景 → 方块为黑色（由浅色主题的 text-gray-900 提供）

    几何（32 视图，实心、无描边 —— 描边缩到 16px 会消失）：
      内边距 4，格 10×10，间距 4：
        左列 x=4，右列 x=18；上行 y=4，下行 y=18。
      装有三格：左上、左下、右下。右上 (18,4) 留空。
      去掉背景后四周留白可以放宽（4 而非 5），让方块本身更大更清楚。
  -->

  <g fill="currentColor">
    <rect x="4" y="4" width="10" height="10" rx="2.6" />
    <rect x="4" y="18" width="10" height="10" rx="2.6" />
    <rect x="18" y="18" width="10" height="10" rx="2.6" />
  </g>
</svg>
